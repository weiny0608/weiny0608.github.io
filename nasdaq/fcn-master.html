    <script type="importmap">{"imports":{"react":"https://esm.sh/react@19.0.0","react-dom/client":"https://esm.sh/react-dom@19.0.0/client","recharts":"https://esm.sh/recharts@3.1.0?deps=react@19.0.0,react-dom@19.0.0","lucide-react":"https://esm.sh/lucide-react@0.468.0?deps=react@19.0.0"}}</script>

      * { letter-spacing: 0 !important; }

  <body class="m-0">
    <div id="root"></div>
    <script type="text/babel" data-type="module">
import React, { useState, useEffect, useRef, useMemo } from 'react';
import { createRoot } from 'react-dom/client';
import { 
    LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip as RechartsTooltip, Legend, ResponsiveContainer, ReferenceLine, AreaChart, Area, BarChart, Bar, Cell
} from 'recharts';
import { Info, TrendingUp, TrendingDown, Minus, RefreshCw, AlertCircle, CheckCircle, Search, HelpCircle, DollarSign, Percent, Calendar, Layers, History, Play, Pause, Download, Save, RotateCcw, Settings2 } from 'lucide-react';

const scenarioData = {
    knockOut: [
        { day: 0, price: 100 },
        { day: 10, price: 102 },
        { day: 20, price: 105 },
        { day: 30, price: 108 }, // KO triggered
    ],
    rangeBound: [
        { day: 0, price: 100 },
        { day: 30, price: 95 },
        { day: 60, price: 103 },
        { day: 90, price: 90 },
        { day: 120, price: 85 },
        { day: 150, price: 92 },
        { day: 180, price: 98 }, // Maturity
    ],
    knockIn: [
        { day: 0, price: 100 },
        { day: 30, price: 85 },
        { day: 60, price: 75 },
        { day: 90, price: 68 }, // KI triggered
        { day: 120, price: 65 },
        { day: 150, price: 70 },
        { day: 180, price: 60 }, // Maturity - takes stock
    ]
};

const Card = ({ children, className = "" }) => (
    <div className={`bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden ${className}`}>
        {children}
    </div>
);


const MASTER_SETTINGS = 'fcn-master-settings-v2';
const masterDefaults = () => ({
    symbols: ['NVDA', 'TSM', 'AAPL', 'MSFT'], initials: ['', '', '', ''],
    start: FCNCore.addMonths(FCNMarket.clock().date, -3), asOf: FCNMarket.clock().date,
    strike: 100, ko: 105, ki: 70, tenor: 6, guarantee: 1, coupon: 12, notional: 100000,
    memory: false, kiType: 'AKI', akiPrice: 'close', koFrequency: 'daily', basis: 365,
    kiInclusive: true, snapshotMode: 'latest', pointTime: FCNMarket.clock().date + 'T15:59',
    autoRefresh: true, autoMinutes: 15, onlyMarket: true, followToday: true
});
function readMasterSettings() {
    const defaults = masterDefaults();
    try {
        const s = JSON.parse(localStorage.getItem(MASTER_SETTINGS));
        if (!s || !Array.isArray(s.symbols) || s.symbols.length !== 4 || !s.symbols.every(x=>typeof x==='string') || !Array.isArray(s.initials) || s.initials.length !== 4) return defaults;
        const merged = {...defaults, ...s};
        if (merged.followToday) merged.asOf = defaults.asOf;
        return merged;
    } catch { return defaults; }
}
function masterConfig(s) {
    return {...s, assets: s.symbols.map((symbol,i)=>({symbol:symbol.trim().toUpperCase(),initial:s.initials[i]===''?null:Number(s.initials[i])})).filter(a=>a.symbol),
        ...Object.fromEntries(['strike','ko','ki','tenor','guarantee','coupon','notional','basis'].map(k=>[k, s[k]===''?NaN:Number(s[k])]))};
}
const marketKey = c => JSON.stringify([c.assets.map(a=>a.symbol), c.start, c.asOf, c.snapshotMode, c.snapshotMode==='time'?c.pointTime:null]);
const fcnNumber = (n, digits=2) => Number.isFinite(n) ? n.toLocaleString('en-US', {maximumFractionDigits:digits, minimumFractionDigits:digits}) : '—';
const FcnField = ({label, children}) => <label className="fcn-field"><span>{label}</span>{children}</label>;
function FCNBasket() {
    const [settings, setSettings] = useState(readMasterSettings);
    const [loaded, setLoaded] = useState(null), [busy,setBusy] = useState(false), [error,setError] = useState('');
    const [note,setNote] = useState(''), [nextAt,setNextAt] = useState(null);
    const [minuteChart,setMinuteChart] = useState(false);
    const [chartAsset,setChartAsset] = useState('all'), [contractOnly,setContractOnly] = useState(false);
    const current = useRef(settings), busyRef = useRef(false), alive = useRef(true);
    current.current = settings;
    const config = masterConfig(settings), key = marketKey(config);
    const update = (k,v) => setSettings(s=>({...s,[k]:v}));
    const outcome = useMemo(()=>{
        if (!loaded || loaded.key!==key) return {};
        try { return {view:FCNMarket.view(config,loaded.bundle)}; }
        catch(e) { return {problem:FCNMarket.message(e)}; }
    }, [loaded, JSON.stringify(config)]);
    const v = outcome.view, r = v?.result;
    async function refresh(force=false) {
        if(busyRef.current) return;
        busyRef.current=true; setBusy(true); setError(''); setNote('');
        const s=current.current;
        const c=masterConfig({...s,asOf:s.followToday?FCNMarket.clock().date:s.asOf});
        try {
            FCNMarket.validate(c);
            if(s.followToday && s.asOf!==c.asOf) setSettings(old=>({...old,asOf:c.asOf}));
            const bundle=await FCNMarket.load(c,force);
            FCNMarket.view(c,bundle);
            if(alive.current) setLoaded({key:marketKey(c),bundle});
        } catch(e) { if(alive.current) setError(FCNMarket.message(e)); }
        finally { busyRef.current=false; if(alive.current){setBusy(false);setNextAt(Date.now()+Number(current.current.autoMinutes)*60000);} }
    }
    useEffect(()=>{alive.current=true;return ()=>{alive.current=false;};},[]);
    useEffect(()=>{
        if(!settings.autoRefresh) {setNextAt(null);return;}
        const first=setTimeout(()=>refresh(),650);
        const timer=setInterval(()=>{
            const s=current.current;
            if(s.followToday && s.asOf!==FCNMarket.clock().date) {setSettings(old=>({...old,asOf:FCNMarket.clock().date}));return;}
            if(s.snapshotMode==='latest' && (!s.onlyMarket || FCNMarket.marketHours())) refresh();
            else setNextAt(Date.now()+Number(s.autoMinutes)*60000);
        },Number(settings.autoMinutes)*60000);
        setNextAt(Date.now()+Number(settings.autoMinutes)*60000);
        return ()=>{clearTimeout(first);clearInterval(timer);};
    },[key,settings.autoRefresh,settings.autoMinutes,settings.onlyMarket]);
    useEffect(()=>{
        const focus=()=>{
            if(document.visibilityState!=='visible') return;
            const s=current.current;
            if(s.autoRefresh && s.snapshotMode==='latest' && (!s.onlyMarket||FCNMarket.marketHours()) && (!loaded || Date.now()-Date.parse(loaded.bundle.fetchedAt)>Number(s.autoMinutes)*60000)) refresh();
        };
        document.addEventListener('visibilitychange',focus);
        return ()=>document.removeEventListener('visibilitychange',focus);
    },[loaded]);
    const saveSettings=()=>{try{localStorage.setItem(MASTER_SETTINGS,JSON.stringify(current.current));setNote('已儲存設定，下次開啟會載入。');}catch{setError('瀏覽器無法儲存設定。');}};
    const download=(format)=>{
        if(!v)return;
        const rows=v.history;
        const text=format==='json'?JSON.stringify({application:'FCN Master',version:2,source:v.bundle.source,fetchedAt:v.bundle.fetchedAt,config:v.config,snapshot:v.snapshot,result:r,history:rows,minuteHistory:v.minuteHistory},null,2):'\uFEFF'+[['date',...v.assets.map(a=>a.symbol+'_percent_of_initial')],...(minuteChart&&v.minuteHistory.length?v.minuteHistory:rows).map(p=>[p.date,...v.assets.map(a=>p[a.symbol])])].map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
        const url=URL.createObjectURL(new Blob([text],{type:format==='json'?'application/json':'text/csv;charset=utf-8'}));
        const a=document.createElement('a');a.href=url;a.download=`FCN_Master_${v.config.asOf}.${format}`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
    };
    const number=(k,label,props={})=><FcnField label={label}><input type="number" value={settings[k]} onChange={e=>update(k,e.target.value)} {...props}/></FcnField>;
    const select=(k,label,options)=><FcnField label={label}><select value={settings[k]} onChange={e=>update(k,e.target.value)}>{options.map(([value,text])=><option key={value} value={value}>{text}</option>)}</select></FcnField>;
    const effectiveChartAsset=chartAsset==='all'||v?.assets.some(a=>a.symbol===chartAsset)?chartAsset:'all';
    const selectedAssets=v?v.assets.filter(a=>effectiveChartAsset==='all'||effectiveChartAsset===a.symbol):[];
    const sourceRows=minuteChart&&v?.minuteHistory.length?v.minuteHistory:v?.history;
    const chartRows=sourceRows?.filter(p=>!contractOnly||p.date.slice(0,10)<=r.endDate).map(p=>Object.fromEntries([['date',p.date],...selectedAssets.map(a=>[a.symbol,effectiveChartAsset==='all'?p[a.symbol]:p[a.symbol]*a.initialPrice/100])]))||[];
    const basis=effectiveChartAsset==='all'?100:selectedAssets[0]?.initialPrice||100;
    const worst=v?.assets.reduce((a,b)=>a.level<=b.level?a:b);
    const statusLabel=r?(r.kind==='KO'?'已提前 KO 贖回':r.ended?(r.loss?'已到期：本金受損':'已到期：本金全額返還'):v.config.asOf>=r.maturity?'等待到期日線':r.kiTriggered?'存續中：日 KI 已觸發':'存續中'):'等待行情';
    const statusTone=r?.loss?'text-red-700':r?.ended?'text-emerald-700':r?.kiTriggered?'text-amber-700':'text-blue-700';
    const colors=['#2563eb','#059669','#d97706','#db2777'];
    return <div className="space-y-5">
        <div className="flex flex-wrap items-center justify-between gap-3">
            <div><h1 className="text-xl font-bold">FCN Master 即時追蹤</h1><p className="text-xs text-slate-500 mt-1">{v?`${v.bundle.source} · ${v.snapshot.label}`:'Twelve Data · 尚未取得行情'}</p></div>
            <div className="flex flex-wrap gap-2">
                <button className="fcn-button" onClick={saveSettings}><Save size={15}/>儲存設定</button>
                <button className="fcn-button" disabled={busy} onClick={()=>{setSettings({...masterDefaults(),autoRefresh:false});setLoaded(null);setError('');setNote('已恢復預設，按立即更新取得行情。');}} title="恢復預設"><RotateCcw size={15}/></button>
                <button className="fcn-button fcn-primary" disabled={busy} onClick={()=>refresh(true)}><RefreshCw size={15} className={busy?'animate-spin':''}/>{busy?'取得行情中':'立即更新'}</button>
            </div>
        </div>
        <section className="bg-white border border-slate-200 rounded-lg p-4">
            <div className="flex items-center flex-wrap gap-x-4 gap-y-3">
                <button className="fcn-button" aria-pressed={settings.autoRefresh} onClick={()=>update('autoRefresh',!settings.autoRefresh)}>{settings.autoRefresh?<Pause size={15}/>:<Play size={15}/>} {settings.autoRefresh?'暫停自動更新':'啟動自動更新'}</button>
                <label className="flex items-center gap-2 text-xs">更新間隔<select aria-label="更新間隔" value={settings.autoMinutes} onChange={e=>update('autoMinutes',Number(e.target.value))} className="border rounded-md p-2">{[1,5,15,30,60].map(n=><option key={n} value={n}>{n} 分鐘</option>)}</select></label>
                <label className="flex items-center gap-2 text-xs"><input type="checkbox" checked={settings.onlyMarket} onChange={e=>update('onlyMarket',e.target.checked)}/>僅美股平日 09:30–16:00 ET</label>
                <span className="text-xs text-slate-500" role="status">{busy?'連線中…':!settings.autoRefresh?'自動更新已暫停':settings.snapshotMode!=='latest'?'歷史模式：修改日期時更新':settings.onlyMarket&&!FCNMarket.marketHours()?'等待美股盤中時段':nextAt?`下次檢查 ${new Date(nextAt).toLocaleTimeString('zh-TW',{hour12:false})}`:'自動更新開啟'}</span>
            </div>
            <p className="text-xs text-slate-500 mt-3">{loaded?`最近取得資料：${new Date(loaded.bundle.fetchedAt).toLocaleString('zh-TW',{hour12:false})}`:'尚無已載入資料'}{v?` ｜ 合約判定至 ${r.endDate}，最新完成日線 ${v.history.filter(p=>!p.date.includes('快照')).at(-1)?.date}`:''}</p>
        </section>
        {(error||outcome.problem)&&<div role="alert" className="border border-red-200 bg-red-50 text-red-700 rounded-lg p-3 text-sm">{error||outcome.problem}{loaded?' 上次載入結果未被新資料取代。':''}</div>}
        {note&&<p role="status" className="text-sm text-emerald-700">{note}</p>}
        {loaded&&loaded.key!==key&&<p className="p-3 text-sm bg-amber-50 text-amber-800 border border-amber-200 rounded-lg">股票或期間已變更，{settings.autoRefresh?'正在套用新設定。':'請按立即更新。'}</p>}
        <section className="bg-white border border-slate-200 rounded-lg p-4">
            <h2 className="font-bold text-sm mb-4 flex gap-2 items-center"><Settings2 size={17}/>合約與資料設定</h2>
            <fieldset disabled={busy}>
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">{settings.symbols.map((s,i)=><div key={i} className="space-y-2"><FcnField label={`標的 ${i+1}`}><input value={s} maxLength={20} placeholder="空白略過" onChange={e=>update('symbols',settings.symbols.map((x,j)=>j===i?e.target.value.toUpperCase():x))}/></FcnField><FcnField label={`標的 ${i+1} 期初價（留白自動）`}><input type="number" min="0.0001" step="any" value={settings.initials[i]} placeholder="期初日收盤價" onChange={e=>update('initials',settings.initials.map((x,j)=>j===i?e.target.value:x))}/></FcnField></div>)}</div>
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                    <FcnField label="期初定價日"><input type="date" max={FCNMarket.clock().date} value={settings.start} onChange={e=>update('start',e.target.value)}/></FcnField>
                    <FcnField label="截至日（紐約）"><input type="date" max={FCNMarket.clock().date} value={settings.asOf} onChange={e=>setSettings(s=>({...s,asOf:e.target.value,followToday:false}))}/></FcnField>
                    {select('snapshotMode','比較價格',[['latest','最新報價'],['asof','截至日收盤'],['time','指定分鐘（ET）']])}
                    {settings.snapshotMode==='time'?<FcnField label="指定時間（紐約 ET）"><input type="datetime-local" value={settings.pointTime} onChange={e=>update('pointTime',e.target.value)}/></FcnField>:<label className="flex items-end gap-2 text-xs pb-3"><input type="checkbox" checked={settings.followToday} onChange={e=>setSettings(s=>({...s,followToday:e.target.checked,asOf:e.target.checked?FCNMarket.clock().date:s.asOf}))}/>截至日自動跟隨今天</label>}
                </div>
                <div className="flex flex-wrap gap-2 mt-3 mb-5">{[3,6,12].map(n=><button key={n} type="button" className="fcn-button" onClick={()=>setSettings(s=>({...s,start:FCNCore.addMonths(s.asOf,-n)}))}><Calendar size={14}/>近 {n} 月</button>)}</div>
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                    {number('strike','執行價 / Strike (%)',{min:.1,max:300,step:.1})}{number('ko','KO (%)',{min:.1,max:300,step:.1})}{number('ki','KI (%)',{min:.1,max:300,step:.1})}
                    <FcnField label="KI 類型"><div className="grid grid-cols-2 h-[38px] border border-slate-300 rounded-md overflow-hidden">{[['AKI','日 KI'],['EKI','期末 KI']].map(([k,label])=><button key={k} type="button" aria-pressed={settings.kiType===k} onClick={()=>update('kiType',k)} className={`text-xs ${settings.kiType===k?'bg-blue-600 text-white':'bg-white text-slate-600'}`}>{label}</button>)}</div></FcnField>
                    {number('tenor','存續期間（月）',{min:1,max:36,step:1})}{number('guarantee','KO 鎖定期（月）',{min:0,max:36,step:1})}{number('coupon','年票息 (%)',{min:0,max:100,step:.1})}{number('notional','本金（USD）',{min:1,step:1000})}
                </div>
                <div className="flex gap-x-5 gap-y-2 flex-wrap mt-4 text-xs">
                    <label className="flex items-center gap-2"><input type="checkbox" checked={settings.memory} onChange={e=>update('memory',e.target.checked)}/>記憶 KO</label>
                    <label className="flex items-center gap-2"><input type="checkbox" checked={settings.kiInclusive} onChange={e=>update('kiInclusive',e.target.checked)}/>觸及 KI 即算觸發（≤）</label>
                </div>
                <details className="mt-4 text-xs"><summary className="cursor-pointer text-slate-600">進階觀察設定</summary><div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-3">{select('koFrequency','KO 觀察頻率',[['daily','每日收盤'],['monthly','每月定價日']])}{select('akiPrice','日 KI 觀察價格',[['close','每日收盤'],['low','每日最低價（近似盤中）']])}{select('basis','計息基礎',[['365','ACT/365'],['360','ACT/360']])}<button className="fcn-button self-end" onClick={()=>{FCNMarket.clearCache();refresh(true);}}><RefreshCw size={14}/>重抓全部日線</button></div></details>
            </fieldset>
        </section>
        {v&&<>
            {v.warnings.map((w,i)=><p key={i} className="text-xs border-l-2 border-amber-400 pl-3 text-amber-800">{w}</p>)}
            <section className="grid grid-cols-2 lg:grid-cols-4 border-y border-slate-200 py-4 gap-5">
                <div><p className="text-xs text-slate-500">合約狀態</p><p className={`font-bold text-lg mt-2 ${statusTone}`}>{statusLabel}</p><p className="text-xs text-slate-500 mt-1">期初 {r.start} / 到期 {r.maturity}</p></div>
                <div><p className="text-xs text-slate-500">比較價最差標的</p><p className="font-bold text-lg mt-2">{v.assets.filter(a=>Math.abs(a.level-worst.level)<1e-8).map(a=>a.symbol).join(' / ')}</p><p className={`text-sm ${worst.performance<0?'text-red-600':'text-emerald-600'}`}>{fcnNumber(worst.level)}%（{fcnNumber(worst.performance)}%）</p></div>
                <div><p className="text-xs text-slate-500">{v.config.kiType==='AKI'?'日 KI':'期末 KI'}</p><p className="font-bold text-lg mt-2">{r.kiTriggered?'已觸發':r.kind==='KO'?'合約已 KO':v.config.kiType==='EKI'&&!r.ended?'到期才觀察':'未觸發'}</p><p className="text-xs text-slate-500 mt-1">{v.config.akiPrice==='low'&&v.config.kiType==='AKI'?'日低價近似觸價':'採有效觀察日收盤價'}</p></div>
                <div><p className="text-xs text-slate-500">模型應計票息 / USD</p><p className="font-bold text-lg mt-2">${fcnNumber(r.coupon)}</p><p className="text-xs text-slate-500 mt-1">{r.days} 天 · 非已支付金額</p></div>
            </section>
            <section className="space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2"><div><h2 className="font-bold text-sm">期間股價曲線</h2><p className="text-xs text-slate-500 mt-1">{chartAsset==='all'?'期初 = 100%':'USD'} · {v.history.length} 筆 · {v.snapshot.label} {v.snapshot.date}</p></div><div className="flex flex-wrap gap-2 items-center"><select aria-label="曲線標的" className="fcn-button" value={chartAsset} onChange={e=>setChartAsset(e.target.value)}><option value="all">全部標的（%）</option>{v.assets.map(a=><option key={a.symbol} value={a.symbol}>{a.symbol}（USD）</option>)}</select><label className="text-xs flex items-center gap-1"><input type="checkbox" checked={contractOnly} onChange={e=>setContractOnly(e.target.checked)}/>合約期間</label><button className="fcn-button" title="下載 CSV 曲線" onClick={()=>download('csv')}><Download size={15}/>CSV</button><button className="fcn-button" title="下載完整 JSON" onClick={()=>download('json')}><Download size={15}/>JSON</button></div></div>
                {v.minuteHistory.length>0&&<label className="text-xs flex items-center gap-2"><input type="checkbox" checked={minuteChart} onChange={e=>{setMinuteChart(e.target.checked);if(e.target.checked)setContractOnly(false);}}/>顯示指定日分鐘曲線（{v.minuteHistory.length} 筆）</label>}

            <section className="grid lg:grid-cols-2 gap-6 border-t border-slate-200 pt-5">
                <div><h2 className="font-bold text-sm mb-3">合約事件</h2><div className="max-h-64 overflow-y-auto divide-y text-xs">{r.events.slice().reverse().map((e,i)=><div key={i} className="py-3 flex gap-4"><span className="text-slate-500 shrink-0">{e.date}</span><span>{({START:'期初定價',KI:'KI 觸發',MEMORY:'KO 記憶新增',KO:'KO 贖回',OBSERVATION:'月度觀察：未 KO',MATURITY:'到期結算'})[e.type]}{e.assets?' · '+e.assets.map(i=>v.assets[i].symbol).join(' / '):''}</span></div>)}</div></div>
                <div><h2 className="font-bold text-sm mb-3">結算結果 / USD</h2><dl className="text-sm space-y-3">{[['本金',fcnNumber(v.config.notional)],['本金返還 / 交割市值',r.ended?fcnNumber(r.principalValue):'未結算'],['應計票息',fcnNumber(r.coupon)],['合計',r.ended?fcnNumber(r.total):'存續中，不估提前解約價值'],['總報酬',r.ended?fcnNumber(r.returnRate*100)+'%':'—']].map(([k,val])=><div key={k} className="flex justify-between gap-3"><dt className="text-slate-500">{k}</dt><dd className="text-right">{val}</dd></div>)}</dl></div>
            </section>
        </>}
        <p className="text-xs text-slate-500 border-t border-slate-200 pt-4 leading-relaxed">行情由雲端資料服務提供，網頁執行更新、繪圖與合約計算。自動更新僅在網頁開啟時運作；休眠或背景分頁可能延後，回到頁面會補查。行情時間以 ET 為準，免費來源可能延遲且受額度限制。合約使用已完成日線，當日於美東 18:00 後納入；期末 KI 只在實際到期觀察日判定，KO 後停止觀察。拆股調整、假日順延與結算以實際合約條款核對。</p>
    </div>;
}

function FCNDashboard() {

    const [error, setError] = useState(null);
    
    // FCN Contract State
    const [strikePrice, setStrikePrice] = useState(100);
    const [koLevel, setKoLevel] = useState(105);
    const [kiLevel, setKiLevel] = useState(70);

    // 透過 AllOrigins Proxy 串接 Yahoo Finance API 獲取真實即時股價
        const fetchStockPrice = async (ticker) => {
        setIsLoading(true);
        setError(null);
        try {
            const quote = FCNMarket.parseQuote(await FCNMarket.request('quote', {symbol: ticker.trim().toUpperCase(), country: 'United States'}), ticker);
            const currentPrice = quote.price;
            if (!currentPrice) throw new Error('無法獲取價格');

            const priceVal = parseFloat(currentPrice.toFixed(2));
            setStockPrice(priceVal);
            
            // 自動將發行價與保護/出場價對齊該標的的真實市價，杜絕固定 $100 造成的爆表假績效
            setQuoteTime(quote.time);
            if (pricedSymbol.current !== ticker.trim().toUpperCase()) {
                setStrikePrice(priceVal);
                setKoLevel(parseFloat((priceVal * 1.05).toFixed(2)));
                setKiLevel(parseFloat((priceVal * 0.70).toFixed(2)));
                pricedSymbol.current = ticker.trim().toUpperCase();
            }

        } catch (err) {
            console.error(err);
            setError(FCNMarket.message(err));
            setStockPrice(null);
        } finally {
            setIsLoading(false);
        }
    };

    useEffect(() => {
        if (activeTab === 'tracker' && !stockPrice) fetchStockPrice(symbol);

    const getFCNStatus = () => {

                    </p>

                    </div>

                    <div className="flex-1">

                            <div className="relative z-10 text-center">

                                {status && (

                                <div 
                                    className="absolute top-4 -translate-y-1/2 flex flex-col items-center transition-all duration-1000 z-20"
                                    style={{ left: `${percentage}%` }}
                                >
                                    <div className={`w-6 h-6 rounded-full border-4 border-white shadow-md flex items-center justify-center ${
                                        status?.type === 'safe' ? 'bg-blue-500' :
                                        status?.type === 'knockOut' ? 'bg-green-500' : 'bg-red-500'
                                    }`}>
                                        <div className="w-1.5 h-1.5 bg-white rounded-full"></div>
                                    </div>
                                    <div className={`mt-2 px-2 py-1 bg-slate-800 text-white text-xs font-bold rounded shadow ${
                                        percentage > 85 ? '-translate-x-full' : (percentage < 15 ? 'translate-x-full' : '-translate-x-1/2')
                                    }`}>
                                        ${stockPrice.toFixed(2)}
                                    </div>
                                </div>
                            );
                        })()}
                    </div>
                </Card>
            )}
        </div>
    );

    return (
        <div className="min-h-screen bg-slate-50 font-sans text-slate-900 pb-12">
            <header className="bg-white border-b border-slate-200 sticky top-0 z-50">
                <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                        <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold italic">
                            F
                        </div>
                        <span className="font-bold text-xl tracking-tight">FCN<span className="text-blue-600">Master</span></span>
                    </div>
                    <div className="flex bg-slate-100 p-1 rounded-lg overflow-x-auto">
                        <button 
                            onClick={() => setActiveTab('tutorial')}
                            className={`px-3 py-1.5 rounded-md text-sm font-medium transition-all whitespace-nowrap ${activeTab === 'tutorial' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-600 hover:text-slate-900'}`}
                        >
                            快速學習
                        </button>
                        <button 
                            onClick={() => setActiveTab('tracker')}
                            className={`px-3 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-1 whitespace-nowrap ${activeTab === 'tracker' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-600 hover:text-slate-900'}`}
                        >
                            <TrendingUp size={16} /> 單一報價
                        </button>
                        <button 
                            onClick={() => setActiveTab('basket')}
                            className={`px-3 py-1.5 rounded-md text-sm font-medium transition-all flex items-center gap-1 whitespace-nowrap ${activeTab === 'basket' ? 'bg-white shadow-sm text-purple-600' : 'text-slate-600 hover:text-slate-900'}`}
                        >
                            <Layers size={16} /> 一籃子 (Worst-Of)
                        </button>
                    </div>
                </div>
            </header>

            <main className="max-w-7xl mx-auto px-4 mt-8">
                {activeTab === 'tutorial' && renderTutorial()}
                {activeTab === 'tracker' && renderTracker()}
                <div hidden={activeTab !== 'basket'}><FCNBasket /></div>
            </main>
            
            <footer className="max-w-7xl mx-auto px-4 mt-12 text-center text-slate-400 text-sm">
                <p>⚠️ 注意：本工具資料來自免費 API，不保證零延遲。僅供教育與模擬使用，並非實際投資建議。</p>
            </footer>
        </div>
    );
}


createRoot(document.getElementById('root')).render(
  <React.StrictMode>
    <FCNDashboard />
  </React.StrictMode>
);

    </script>
  </body>
</html>
