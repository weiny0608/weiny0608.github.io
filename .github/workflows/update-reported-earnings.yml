name: Update reported earnings

on:
  schedule:
    # Cover U.S. premarket through evening earnings releases in both time zones.
    - cron: '38 11-23 * * 1-5'
    - cron: '38 0-3 * * 2-6'
    # Some issuers publish results on weekends.
    - cron: '38 16 * * 0,6'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-reported-earnings.yml'
      - 'scripts/issuer_earnings.py'
      - 'scripts/issuer_exhibit_specials.py'
      - 'scripts/sec_ticker_ciks.json'
      - 'scripts/sync_reported_earnings.py'
      - 'scripts/test_sync_reported_earnings.py'

permissions:
  contents: write
  pages: write

concurrency:
  group: reported-earnings
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify quarterly earnings parser
        run: python3 -B -m unittest discover -s scripts -p 'test_sync_reported_earnings.py'
      - name: Check issuer filings
        env:
          SEC_USER_AGENT: >-
            ${{ secrets.SEC_USER_AGENT || vars.SEC_USER_AGENT || format('NASDAQ Valuation Dashboard (contact: https://github.com/{0}/issues)', github.repository) }}
        run: python3 scripts/sync_reported_earnings.py
      - name: Commit verified results
        run: |
          git add -- reported_earnings.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh verified quarterly earnings'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
      - name: Publish updated data to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if curl -fsS --max-time 15 -H 'Cache-Control: no-cache' \
            "https://weiny0608.github.io/reported_earnings.json?sha=$(git rev-parse HEAD)" \
            -o "$RUNNER_TEMP/published-earnings.json" &&
            cmp -s reported_earnings.json "$RUNNER_TEMP/published-earnings.json"; then
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
