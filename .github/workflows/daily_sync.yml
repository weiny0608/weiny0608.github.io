name: Daily Cloud Sync from Google Sheets & FRED

on:
  schedule:
    # 台北時間週二至週六清晨 06:15 (UTC 22:15 前一日) 全自動執行，完全不依賴個人 Mac 開機
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cloud-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync Google Sheets & FRED to JSON/JS
        run: python3 scripts/cloud_sheets_to_github_sync.py

      - name: Commit and Push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earnings_hub.json macro_indicators.json livequotes_hub.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(cloud-sync): auto-sync Google Sheets & FRED data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          else
            echo "No changes detected."
          fi
