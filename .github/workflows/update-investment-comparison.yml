name: Update investment comparison data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nasdaq/index.html'
      - 'large-company-financial-dashboard/index.html'
      - 'earnings_hub.json'
      - 'macro_indicators.json'
      - 'investment-comparison-data/*.js'
      - 'investment-comparison-data/*.mjs'
      - 'investment-comparison-data/*.cjs'
      - '.github/workflows/update-investment-comparison.yml'
permissions:
  contents: write
concurrency:
  group: investment-comparison-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Verify data parser
        run: node --test investment-comparison-data/sync.test.cjs
      - name: Refresh only the new comparison feed
        run: node investment-comparison-data/sync.mjs --root .
      - name: Commit only the new feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- investment-comparison-data/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update independent investment comparison feed'
          git pull --rebase origin main
          git push origin HEAD:main
